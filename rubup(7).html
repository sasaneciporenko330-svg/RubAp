<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RubUP Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050f26;--s1:#0b1d44;--s2:#12295c;--ln:#1d3a7a;--ac:#3d8bff;--cy:#35d0ff;--tx:#eaf2ff;--mu:#8ea8d8;--ok:#3de0a0;--bad:#ff5d7a;--gold:#ffc24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-weight:500}
body{background:radial-gradient(120% 60% at 50% -10%,#123a8c 0%,var(--bg) 60%) no-repeat;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
button,input,select{font:inherit;color:inherit}
body::before{content:"RUBUP";position:fixed;inset:0;display:grid;place-items:center;font-size:27vw;font-weight:800;letter-spacing:-.03em;color:rgba(61,139,255,.075);transform:rotate(-12deg);pointer-events:none;z-index:0}
header,main,nav{position:relative;z-index:1}
.roll{position:relative;overflow:hidden;border-radius:16px;background:var(--bg);border:1px solid var(--ln);padding:14px 0;margin:14px 0}
.roll::before,.roll::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.roll::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}.roll::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);z-index:3;transform:translateX(-50%);box-shadow:0 0 14px var(--gold)}
.strip{display:flex;gap:8px;will-change:transform}
.si{flex:none;width:96px;text-align:center}.si .nft{width:84px;height:84px;margin:0 auto 4px;font-size:44px}
.si small{color:var(--mu);font-size:11px}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
header b{font-size:19px;font-weight:800;letter-spacing:.2px}
.bal{background:var(--s2);border:1px solid var(--ln);border-radius:20px;padding:7px 14px;font-weight:800;color:var(--cy)}
main{flex:1;overflow:auto;padding:4px 14px 24px}
nav{display:flex;background:var(--s1);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mu);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px}
nav button i{font-style:normal;font-size:22px}
nav button.on{color:#fff;background:linear-gradient(180deg,#1b4aa8,#143577)}
h2{font-size:20px;margin:14px 0 10px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:18px;padding:14px}
.tile{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile i{font-style:normal;font-size:30px}
.tile b{font-size:15px}.tile small{color:var(--mu);font-size:12px}
.tile.lock{opacity:.5}
.btn{background:linear-gradient(180deg,#4a97ff,#2a6be0);border:0;border-radius:14px;padding:13px 16px;font-weight:800;width:100%;cursor:pointer;box-shadow:0 4px 0 #17418f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #17418f}
.btn.alt{background:var(--s2);box-shadow:none;border:1px solid var(--ln)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.btn.gold{background:linear-gradient(180deg,#ffd36b,#f2a51f);color:#3a2600;box-shadow:0 4px 0 #a46c06}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.chip{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:9px 6px;text-align:center;font-weight:700;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--cy)}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--cy)}
.mu{color:var(--mu);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;justify-content:space-between}
.back{background:none;border:0;color:var(--cy);font-weight:700;padding:6px 0;cursor:pointer}
.ch{display:grid;gap:8px;margin-top:10px}
.ch button{background:var(--s2);border:1px solid var(--ln);border-radius:14px;padding:12px 8px;font-weight:700;cursor:pointer}
.ch button:active{background:var(--ac)}
.ch small{display:block;color:var(--cy);font-size:12px;margin-top:2px}
.nft{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:34px;flex:none;border:1px solid rgba(255,255,255,.25);overflow:hidden}
.nft img{width:100%;height:100%;object-fit:cover}
.nft.b{width:110px;height:110px;font-size:60px;border-radius:24px}
.case{text-align:center;cursor:pointer}
.case .nft{margin:0 auto 8px;width:86px;height:86px;font-size:46px}
.pr{color:var(--gold);font-weight:800}
.sheet{position:fixed;inset:0;background:rgba(2,8,24,.75);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--s1);border:1px solid var(--ln);border-radius:24px 24px 0 0;width:100%;max-height:88%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.res{text-align:center}
.res .big{font-size:44px;margin:6px 0}
.res .nft{margin:8px auto}
.win{color:var(--ok)}.lose{color:var(--bad)}
.cr{font-size:54px;font-weight:800;text-align:center;margin:14px 0;color:var(--cy)}
.cr.dead{color:var(--bad)}
.sky{position:relative;height:240px;border-radius:18px;overflow:hidden;border:1px solid var(--ln);margin:12px 0;background:linear-gradient(180deg,#06173b,#0d2a66 70%,#14398a)}
.sky::before{content:"";position:absolute;inset:0;opacity:.85;background-size:170px 170px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 85px 95px,#9fd0ff,transparent),radial-gradient(2px 2px at 140px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 150px,#fff,transparent)}
.sky.fly::before{animation:stars .5s linear infinite}@keyframes stars{to{background-position:-170px 170px}}
.sky.dead{border-color:var(--bad);box-shadow:inset 0 0 40px rgba(255,93,122,.35)}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky polyline{fill:none;stroke:#ffb347;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.8}
.sky .cr{position:absolute;left:0;right:0;top:10px;margin:0;font-size:40px;z-index:2}
.rk{position:absolute;font-size:40px;line-height:1;transform:translate(-50%,50%);transition:left .1s linear,bottom .1s linear;filter:drop-shadow(0 0 10px #ffb347);z-index:1}
.rk.shake{animation:shk .12s infinite}@keyframes shk{50%{transform:translate(-50%,50%) rotate(4deg)}}
.rk.boom{animation:boom .5s ease-out forwards;filter:none}@keyframes boom{from{transform:translate(-50%,50%) scale(.4)}to{transform:translate(-50%,50%) scale(2)}}
.wh{position:relative;width:240px;height:240px;margin:16px auto}
.disk{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ln);box-shadow:0 0 30px rgba(61,139,255,.35)}
.hub{position:absolute;inset:70px;border-radius:50%;background:var(--s1);border:2px solid var(--ln);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--cy)}
.ptr{position:absolute;left:50%;top:-14px;width:0;height:0;border:12px solid transparent;border-top:22px solid var(--gold);border-bottom:0;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 0 6px var(--gold))}
.stg{position:relative;min-height:240px;display:grid;place-items:center;margin:10px 0;perspective:700px}
.stg.shk{animation:shk2 .16s infinite}
.r2{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.dd{width:84px;height:84px;border-radius:20px;background:#fff;color:#0b1d44;font-size:44px;font-weight:800;display:grid;place-items:center;box-shadow:0 6px 0 #9fb8e8}
.dd.cl{width:96px;height:96px;font-size:34px;border-radius:50%}
.dd.rd{background:#ff5d7a;color:#fff;box-shadow:0 6px 0 #a02a42}.dd.bk{background:#0b1d44;color:#fff;box-shadow:0 6px 0 #000;border:2px solid var(--ln)}.dd.gn{background:var(--ok);color:#06241a;box-shadow:0 6px 0 #1a8f66}
.reel{width:76px;height:96px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:48px;box-shadow:0 6px 0 #9fb8e8}
.coin{width:130px;height:130px;position:relative;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.2,.7,.2,1)}
.coin div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:66px;backface-visibility:hidden;background:radial-gradient(circle at 30% 30%,#ffe08a,#d9941a);border:5px solid #fff5}
.coin .bk{transform:rotateY(180deg)}
.fld{position:relative;width:100%;height:230px}
.tg{position:absolute;font-size:70px;transform:translate(-50%,-50%)}
.bl{position:absolute;font-size:36px;transform:translate(-50%,-50%);transition:left .8s linear,top .8s cubic-bezier(.2,.9,.4,1)}
.pins{position:absolute;right:6%;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(4,16px);gap:8px}
.pin{width:16px;height:30px;background:#fff;border-radius:8px 8px 4px 4px;transition:all .4s}.pin.fall{transform:rotate(80deg) translateX(24px);opacity:.15}
.lane{position:absolute;left:0;right:0;top:50%;height:60px;transform:translateY(-50%);background:linear-gradient(90deg,#1a3f86,#0d2a66);border-radius:10px}
.cst{font-size:68px;display:inline-block;animation:shk2 .25s infinite}.cst.dn{animation:pop .4s}
@keyframes shk2{25%{transform:rotate(-6deg) translateY(-3px)}75%{transform:rotate(6deg) translateY(3px)}}
.tgt{position:relative;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ff5d7a 0 8%,#fff 8% 20%,#3d8bff 20% 40%,#fff 40% 60%,#0b1d44 60% 100%);border:3px solid var(--ln)}
.dart{position:absolute;font-size:30px;transform:translate(-50%,-100%);transition:left .7s cubic-bezier(.2,.8,.3,1),top .7s cubic-bezier(.2,.8,.3,1)}
.pl{position:relative;width:100%;height:270px}
.pg{position:absolute;width:7px;height:7px;border-radius:50%;background:#9fb8e8;transform:translate(-50%,-50%)}
.pb{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe08a,#f2a51f);transform:translate(-50%,-50%);transition:left .28s ease-in-out,top .28s cubic-bezier(.4,0,.8,1);box-shadow:0 0 10px #ffb347}
.ps{position:absolute;bottom:0;width:11.11%;text-align:center;font-size:11px;font-weight:700;padding:5px 0;border-radius:8px;background:var(--s2);color:var(--mu)}.ps.on{background:var(--gold);color:#3a2600}
.tag{background:var(--s2);border-radius:8px;padding:2px 8px;font-size:11px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){.sheet>div,.pop,.sky.fly::before,.rk.shake,.cst,.stg.shk,.coin{animation:none;transition:none}}
</style>
</head>
<body>
<header><b>RubUP</b><div class="bal" id="bal">0 ⭐</div></header>
<main id="main"></main>
<nav>
<button data-t="games" class="on"><i>🎮</i>Игры</button>
<button data-t="cases"><i>🎁</i>Кейсы</button>
<button data-t="acc"><i>👤</i>Аккаунт</button>
</nav>
<div id="sh"></div>

<script>
/* ============ НАСТРОЙКИ ============ */
const CFG={EDGE:.20,HIT:.5, /* EDGE — комиссия казино; HIT — доля «честных» шансов (0.5 = шансы выигрыша вдвое ниже, множители выше). Реальные шансы показаны на кнопках */
  MIN_BET:50,MAX_BET:5000,MAX_PAYOUT:100000,WD_DAILY:100000,
  NFT_USER:'RubUpdeppodarkami',BOT:'RubUp_bot',OPEN_URL:'https://tg.catup.lol/RubUp_bot/rubup',CREATOR_PCT:7,
  ADMINS:['dural','imabout'],SPONSORS:{nesquik:'несквик',dural:'woly',imabout:'about'},
  CODE_ADMIN:'397281',CODE_SPONSOR:'292819',SUPPORT:['Dural','Nesquik'],
  LEGENDARY_CHANCE:0.05, /* шанс (в %) на самый дорогой NFT в кейсе */
  PROMO_MIN:1,PROMO_MAX:50};
/* ВАЖНО: сейчас баланс/выигрыши считаются в браузере (демо). В боевой версии
   все операции (ставка, кейс, промокод, вывод) нужно делать на сервере бота. */

/* ============ СОСТОЯНИЕ ============ */
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#050f26');tg.setBackgroundColor('#050f26')}catch(e){}}
let U=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||{};
if(!U.id){try{const d=new URLSearchParams(new URLSearchParams(location.hash.slice(1)).get('tgWebAppData')||'');U=JSON.parse(d.get('user')||'{}')}catch(e){U={}}}
const inTg=!!(tg&&tg.initData)||!!U.id||window.self!==window.top;
function tgl(u){const l='https://t.me/'+u;try{if(tg&&tg.openTelegramLink)return tg.openTelegramLink(l)}catch(e){}window.open(l,'_blank')}
const uname=(U.username||'').toLowerCase();
const isAdmin=CFG.ADMINS.includes(uname), spCode=CFG.SPONSORS[uname];
const def={bal:0,inv:[],used:{},author:'',wd:{d:'',s:0},req:[],games:0,won:0};
let S=def;
try{S=Object.assign({},def,JSON.parse(localStorage.getItem('rubup2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rubup2',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n|0;
const pick=a=>a[rnd(a.length)];
const day=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Math.floor(n).toLocaleString('ru-RU');
const hap=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
function setBal(d){S.bal+=d;save();$('#bal').textContent=fmt(S.bal)+' ⭐'}
function toast(t){tg&&tg.showAlert?tg.showAlert(t):alert(t)}

/* ============ NFT И КЕЙСЫ ============ */
const art=(n,big)=>`<div class="nft ${big?'b':''}" style="background:radial-gradient(circle at 30% 25%,hsl(${n.h} 90% 62%),hsl(${(n.h+40)%360} 80% 28%))">${n.img?`<img src="${n.img}" alt="">`:n.e}</div>`;
/* img:'URL' — сюда можно подставить реальную картинку NFT */
const TIERS=[[.35,45],[.7,30],[1.3,17],[3,7.95],[40,CFG.LEGENDARY_CHANCE]]; /* [множитель цены, шанс %] */
const TOP_TIERS=[[.43,50],[.8,30],[1.4,14],[3,5.95],[40,CFG.LEGENDARY_CHANCE]]; /* кейс «Легенда»: минимум 30 100 ⭐ */
const CASES=[
 {n:'Стартовый',p:150,e:'📦',h:210,it:[['Candy Cane','🍬'],['Lol Pop','🍭'],['Jelly Bunny','🐰'],['Toy Bear','🧸'],['Plush Pepe','🐸']]},
 {n:'Лёд',p:500,e:'🧊',h:195,it:[['Ice Cream','🍦'],['Snow Globe','🔮'],['Winter Hat','🧢'],['Heart Locket','💙'],['Durov Cap','🎩']]},
 {n:'Космос',p:2000,e:'🚀',h:240,it:[['Star Dust','✨'],['Moon Cake','🌙'],['Astral Shard','💠'],['Ion Gem','💎'],['Galaxy Crown','👑']]},
 {n:'Океан',p:7000,e:'🌊',h:200,it:[['Sea Shell','🐚'],['Pearl','🫧'],['Kraken','🦑'],['Trident','🔱'],['Atlantis Gem','🔷']]},
 {n:'Элита',p:20000,e:'🏆',h:225,it:[['Silver Ring','💍'],['Gold Watch','⌚'],['Sapphire','🔹'],['Royal Scepter','🪄'],['Blue Diamond','💎']]},
 {n:'Легенда',p:70000,e:'👑',h:215,it:[['Neon Skull','💀'],['Cyber Dragon','🐉'],['Crystal Phoenix','🦅'],['Titan Core','🔆'],['Genesis Pepe','🐸']]},
 {n:'Новичок',p:50,e:'🎈',h:180,it:[['Mini Balloon','🎈'],['Sticky Note','📝'],['Lucky Clover','🍀'],['Party Hat','🥳'],['Rainbow Pepe','🐸']]},
 {n:'Искра',p:300,e:'🔥',h:205,it:[['Spark','✨'],['Torch','🔦'],['Flame Heart','❤️‍🔥'],['Fire Drake','🐲'],['Phoenix Egg','🥚']]},
 {n:'Лес',p:1000,e:'🌲',h:170,it:[['Acorn','🌰'],['Mushroom','🍄'],['Night Owl','🦉'],['Wolf Spirit','🐺'],['Ancient Ent','🌳']]},
 {n:'Пустыня',p:4000,e:'🏜️',h:215,it:[['Cactus','🌵'],['Scarab','🪲'],['Sand Lion','🦁'],['Golden Vase','🏺'],['Pharaoh Mask','🎭']]},
 {n:'Магия',p:12000,e:'🔮',h:260,it:[['Potion','🧪'],['Spell Book','📖'],['Wizard Hat','🧙'],['Crystal Ball','🔮'],['Archmage Staff','🪄']]},
 {n:'Империя',p:40000,e:'🏰',h:230,it:[['Royal Seal','📜'],['Knight Shield','🛡️'],['Crown Jewel','💠'],['Throne Dragon','🐲'],['Emperor Crown','👑']]}
].sort((a,b)=>a.p-b.p).map((c,i)=>({...c,id:i,items:c.it.map(([n,e],k)=>({id:c.n+k,name:n,e,h:(c.h+k*12)%360,v:Math.round(c.p*(c.p>=70000?TOP_TIERS:TIERS)[k][0]),w:(c.p>=70000?TOP_TIERS:TIERS)[k][1]}))}));

function openCase(i){
  const c=CASES[i];
  sheet(`<div class="res"><div class="nft b" style="margin:0 auto;background:linear-gradient(160deg,#2a6be0,#0b1d44)">${c.e}</div>
  <h2>Кейс «${c.n}»</h2><div class="pr">${fmt(c.p)} ⭐</div></div>
  <div class="list" style="margin:14px 0">${c.items.slice().reverse().map(x=>`<div class="li"><div class="row" style="flex-wrap:nowrap">${art(x)}<div><b>${x.name}</b><div class="mu">${fmt(x.v)} ⭐</div></div></div><span class="tag">${x.w}%</span></div>`).join('')}</div>
  <button class="btn" onclick="buyCase(${i})">Открыть за ${fmt(c.p)} ⭐</button>`);
}
function buyCase(i){
  const c=CASES[i]; if(S.bal<c.p)return toast('Недостаточно ⭐');
  setBal(-c.p);
  let r=rnd(1e6)/1e4,a=0,it=c.items[0];            /* r: 0..100 с шагом 0.0001 */
  for(const x of c.items){a+=x.w;if(r<a){it=x;break}}
  S.inv.push({...it,t:Date.now()});S.games++;save();
  const N=46,W=104,WIN=38,vis=c.items.map(x=>Math.max(x.w,2)),tot=vis.reduce((p,q)=>p+q,0);
  const vp=()=>{let t=rnd(1e6)/1e6*tot;for(let k=0;k<vis.length;k++){t-=vis[k];if(t<0)return c.items[k]}return c.items[0]};
  const strip=Array.from({length:N},(_,k)=>k==WIN?it:vp());
  const idx=S.inv.length-1;
  sheet(`<div class="res"><div class="mu">Открываем кейс «${c.n}»…</div>
  <div class="roll"><div class="mark"></div><div class="strip" id="st">${strip.map(x=>`<div class="si">${art(x)}<small>${fmt(x.v)} ⭐</small></div>`).join('')}</div></div><div id="rr" style="min-height:190px"></div></div>`);
  const st=$('#st'),cw=st.parentElement.clientWidth,rm=matchMedia('(prefers-reduced-motion:reduce)').matches,T=rm?.5:5.5;
  const to=WIN*W+48-cw/2+(rnd(50)-25);
  st.style.transition=`transform ${T}s cubic-bezier(.1,.75,.12,1)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{st.style.transform=`translateX(-${to}px)`}));
  setTimeout(()=>{const el=$('#rr');if(!el)return;hap('success');
    el.innerHTML=`<div class="pop"><div class="mu">Вам выпало</div><h2 style="margin:4px 0">${it.name}</h2><div class="pr">${fmt(it.v)} ⭐</div>
    <div class="row" style="margin-top:14px"><button class="btn alt" onclick="sellNft(${idx},1)">Продать за ${fmt(it.v)} ⭐</button><button class="btn" onclick="openCase(${i})">Ещё раз</button></div></div>`},T*1000+150);
}
function sellNft(k,fromCase){
  const it=S.inv[k]; if(!it)return; S.inv.splice(k,1); setBal(it.v); closeSheet(); if(!fromCase)tab('acc');
}

/* ============ ИГРЫ (по твоему боту) ============ */
const RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const pairs=(()=>{const r=[];for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)r.push([a,b]);return r})();

let bet=100;
const pc=p=>(p*100).toFixed(p<.01?2:p<.1?1:0)+'%';
const mult=p=>Math.min(1000,Math.floor((1-CFG.EDGE)/p*100)/100);
const betUI=()=>`<div class="card" style="margin:10px 0"><div class="mu">Ставка, ⭐</div><div class="row" style="margin:8px 0">${[50,100,250,500,1000].map(v=>`<div class="chip ${v==bet?'on':''}" onclick="setBet(${v})">${v}</div>`).join('')}</div><input id="bi" type="number" inputmode="numeric" value="${bet}" oninput="bet=+this.value||0"></div>`;
function setBet(v){bet=v;$('#bi').value=v;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.textContent==v))}
function okBet(){bet=Math.floor(bet);if(!(bet>=CFG.MIN_BET&&bet<=CFG.MAX_BET)){toast(`Ставка от ${CFG.MIN_BET} до ${CFG.MAX_BET} ⭐`);return false}
  if(bet>S.bal){toast('Недостаточно ⭐');return false}return true}

function gamesTab(){
  $('#main').innerHTML=`<h2>Игры</h2><div class="grid">${Object.entries(GAMES).map(([k,g])=>`<div class="card tile ${g.lock?'lock':''}" onclick="${g.lock?'':`game('${k}')`}"><i>${g.i}</i><b>${g.n}</b><small>${g.lock?'Скоро':'Играть'}</small></div>`).join('')}</div>`;
}
function game(k){
  const g=GAMES[k];
  if(g.crash)return crashUI();
  const hit=g.noHit?1:CFG.HIT;
  const info=g.ch.map(c=>{const p=c.t?g.U.filter(c.t).length/g.U.length*hit:0;return{...c,m:c.t?mult(p):null,p}});
  $('#main').innerHTML=`<button class="back" onclick="gamesTab()">← К играм</button><h2>${g.i} ${g.n}</h2><div class="mu">${g.d}</div><div class="mu">Шансы на кнопках реальные: чем реже выигрыш, тем выше множитель.</div>${betUI()}
  <div class="ch" style="grid-template-columns:repeat(${g.cols},1fr)">${info.map((c,j)=>`<button onclick="play('${k}',${j})">${c.l}${c.m?`<small>x${c.m} · ${pc(c.p)}</small>`:''}</button>`).join('')}</div>`;
}
function play(k,j){
  if(!okBet())return;const g=GAMES[k],c=g.ch[j],hit=g.noHit?1:CFG.HIT;let o=pick(g.U);
  if(c.t&&c.t(o)&&rnd(1000)>=hit*1000){const L=g.U.filter(v=>!c.t(v));if(L.length)o=pick(L)}  /* снижаем шанс ровно до показанного */
  let m;if(c.m)m=c.m(o);else{const p=g.U.filter(c.t).length/g.U.length*hit;m=c.t(o)?mult(p):0}
  if(g.wheel)return wheelSpin(g,c,o,m);
  if(ANIM[k])return animPlay(k,g,m,o);
  settle(bet,m,g.f(o),k);
}
function wheelSpin(g,c,o,m){
  const b=bet,p=g.U.filter(c.t).length/g.U.length,ang=(o-.5)/1000*360,rot=360*7-ang,T=matchMedia('(prefers-reduced-motion:reduce)').matches?.5:5.5;
  setBal(-b);
  sheet(`<div class="res"><div class="mu">Апгрейд ${fmt(b)} ⭐ → x${c.x} · шанс ${pc(p)}</div>
  <div class="wh"><div class="ptr"></div><div class="disk" id="dk" style="background:conic-gradient(var(--ok) 0 ${p*360}deg,var(--bad) ${p*360}deg 360deg)"></div><div class="hub">x${c.x}</div></div><div id="rr" style="min-height:120px"></div></div>`);
  const dk=$('#dk');dk.style.transition=`transform ${T}s cubic-bezier(.1,.7,.1,1)`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{dk.style.transform=`rotate(${rot}deg)`}));
  setTimeout(()=>{setBal(b);settle(b,m,g.f(o),'up')},T*1000+200);
}

}

 plinko:async(st,o)=>{
   const c=shuf(PL.map((v,i)=>v==o?i:-1).filter(i=>i>=0))[0],path=shuf([...Array(c).fill(1),...Array(8-c).fill(0)]);
   let pg='';for(let r=0;r<8;r++)for(let j=0;j<=r;j++)pg+=`<div class="pg" style="left:${50+(j-r/2)*11.11}%;top:${8+r*9.5}%"></div>`;
   st.innerHTML=`<div class="pl">${pg}<div class="pb" id="pb" style="left:50%;top:0%"></div>${PL.map((v,i)=>`<div class="ps" id="s${i}" style="left:${i*11.11}%">x${v}</div>`).join('')}</div>`;
   const pb=$('#pb');let x=50;await sleep(300);
   for(let r=0;r<8;r++){x+=path[r]?5.555:-5.555;pb.style.left=x+'%';pb.style.top=(8+r*9.5+4.5)+'%';await sleep(330)}
   pb.style.top='80%';$('#s'+c).classList.add('on');await sleep(500)},
 darts:async(st,o)=>{
   const r={6:.05,5:.2,4:.4,3:.62,2:.82,1:1.25}[o],a=rnd(628)/100,px=50+Math.cos(a)*r*50,py=50+Math.sin(a)*r*50;
   st.innerHTML=`<div class="tgt"><div class="dart" id="dt" style="left:50%;top:150%">📍</div></div>`;await sleep(400);$('#dt').style.left=px+'%';$('#dt').style.top=py+'%';await sleep(1100)},
 basket:(st,o)=>animBasket(st,o>=4),
 football:(st,o)=>animFootball(st,o>=3),
 bowling:(st,o)=>animBowling(st,o)
};

function settle(b,m,txt,k){
  let win=Math.min(Math.floor(b*m),CFG.MAX_PAYOUT);
  setBal(win-b);S.games++;S.won+=win;save();hap(win>=b?'success':'error');
  sheet(`<div class="res"><div class="big">${win>0?'🎉':'💨'}</div><div class="mu">${txt}</div><h2 class="${win>=b?'win':'lose'}">${win>0?'+'+fmt(win)+' ⭐':'Проигрыш −'+fmt(b)+' ⭐'}</h2>
  ${m?`<div class="mu">Множитель x${+m.toFixed(2)}</div>`:''}<button class="btn" style="margin-top:14px" onclick="closeSheet()">Играть ещё</button></div>`);
}

/* --- Краш --- */
let C=null,CT=null;
function crashUI(){
  $('#main').innerHTML=`<button class="back" onclick="crashStop();gamesTab()">← К играм</button><h2>📈 Краш</h2><div class="mu">Ракета набирает высоту. Заберите выигрыш до взрыва.</div>${betUI()}
  <div class="sky" id="sky"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="tr" points=""/></svg><div class="rk" id="rk" style="left:10%;bottom:12%">🚀</div><div class="cr" id="cr">x1.00</div></div>
  <button class="btn" id="cb" onclick="crashGo()">Запустить ракету</button>`;
}
function crashStop(){clearInterval(CT);C=null}
const rkPos=x=>{const p=Math.min(1,Math.log(x)/Math.log(15));return[10+p*78,12+Math.pow(p,.85)*68]};
function crashGo(){
  const sky=$('#sky'),rk=$('#rk'),cb=$('#cb');
  if(C){ /* забрать */
    const b=C.b,w=Math.min(Math.floor(b*C.x),CFG.MAX_PAYOUT),x=C.x;clearInterval(CT);setBal(w);S.games++;S.won+=w;save();hap('success');
    sky.classList.remove('fly');rk.classList.remove('shake');cb.textContent='Запустить ракету';cb.className='btn';C=null;
    return toast('Выигрыш: +'+fmt(w)+' ⭐ (x'+x.toFixed(2)+')');
  }
  if(!okBet())return;setBal(-bet);
  const r=Math.max(rnd(1e6)/1e6,1e-6),pt=Math.max(1,Math.floor((1-CFG.EDGE)/(1-r)*100)/100);
  C={b:bet,x:1,pt};
  $('#tr').setAttribute('points','10,88');$('#cr').textContent='x1.00';$('#cr').className='cr';
  sky.className='sky fly';rk.className='rk shake';rk.textContent='🚀';rk.style.left='10%';rk.style.bottom='12%';
  cb.textContent='Забрать';cb.className='btn gold';
  CT=setInterval(()=>{
    C.x=+(C.x*1.02+.005).toFixed(2);
    if(C.x>=C.pt){
      clearInterval(CT);const[px,py]=rkPos(C.pt);rk.style.left=px+'%';rk.style.bottom=py+'%';
      rk.className='rk boom';rk.textContent='💥';sky.className='sky dead';
      $('#cr').textContent='💥 x'+C.pt.toFixed(2);$('#cr').className='cr dead';
      cb.textContent='Запустить ракету';cb.className='btn';S.games++;save();hap('error');C=null;
    }else{
      const[px,py]=rkPos(C.x);rk.style.left=px+'%';rk.style.bottom=py+'%';
      const t=$('#tr');t.setAttribute('points',t.getAttribute('points')+` ${px},${100-py}`);
      $('#cr').textContent='x'+C.x.toFixed(2);
    }
  },100);
}

/* ============ КЕЙСЫ (вкладка) ============ */
function casesTab(){
  $('#main').innerHTML=`<h2>NFT-кейсы</h2><div class="mu">Чем дороже кейс — тем ценнее NFT внутри. Шанс на главный приз — ${CFG.LEGENDARY_CHANCE}%.</div>
  <div class="grid" style="margin-top:12px">${CASES.map(c=>`<div class="card case" onclick="openCase(${c.id})"><div class="nft" style="background:linear-gradient(160deg,hsl(${c.h} 85% 55%),#0b1d44)">${c.e}</div><b>${c.n}</b><div class="pr">${fmt(c.p)} ⭐</div></div>`).join('')}</div>`;
}

/* ============ АККАУНТ ============ */
function accTab(){
  const code=dailyCode(),got=S.used['D'+day()];
  $('#main').innerHTML=`<h2>${U.first_name||'Аккаунт'}</h2>
  <div class="card"><div class="mu">Баланс</div><div style="font-size:32px;font-weight:800;color:var(--cy)">${fmt(S.bal)} ⭐</div>
  <div class="mu">Игр: ${S.games} · Выиграно: ${fmt(S.won)} ⭐</div>
  <div class="row" style="margin-top:12px"><button class="btn sm" onclick="wdUI()">Вывод</button><button class="btn sm alt" onclick="nftDep()">Внести NFT</button></div></div>
  <div class="card" style="margin-top:10px"><div class="li"><b>🎁 Ежедневный промокод</b><span class="tag">обновляется в 00:00</span></div>
  <div class="mu" style="margin:6px 0">${CFG.PROMO_MIN}–${CFG.PROMO_MAX} ⭐ для всех. Сегодня:</div>
  <div class="li"><div style="font-size:22px;font-weight:800;letter-spacing:1px">${code}</div>
  <button class="btn sm ${got?'alt':''}" ${got?'disabled':''} onclick="promo('${code}')">${got?'Получено':'Забрать'}</button></div></div>
  <div class="list" style="margin-top:10px">
  <div class="card"><b>Промокод</b><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="pi" placeholder="Введите код"><button class="btn sm" style="flex:none" onclick="promo($('#pi').value)">ОК</button></div></div>
  <div class="card"><b>Код автора</b><div class="mu">${S.author?'Ваш код: '+S.author:`Автор получает ${CFG.CREATOR_PCT}% от ваших пополнений`}</div>
  ${S.author?'':`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="ai" placeholder="Код автора"><button class="btn sm" style="flex:none" onclick="author()">ОК</button></div>`}</div>
  <button class="btn alt" onclick="invUI()">🎒 Инвентарь NFT (${S.inv.length})</button>
  <button class="btn alt" onclick="askCode('sp')">🤝 Меню спонсора</button>
  <button class="btn alt" onclick="askCode('ad')">🛠 Админ панель</button>
  <button class="btn alt" onclick="supportUI()">💬 Поддержка</button></div>`;
}
const hash=s=>{let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0};
const dailyCode=()=>'RUB'+hash(day()).toString(36).toUpperCase().slice(0,5);
const dailyReward=()=>CFG.PROMO_MIN+hash(day()+'r')%(CFG.PROMO_MAX-CFG.PROMO_MIN+1);
function promo(t){
  t=(t||'').trim().toUpperCase();if(!t)return;
  if(t!==dailyCode())return toast('Такого промокода нет или он устарел');
  if(S.used['D'+day()])return toast('Вы уже активировали сегодняшний код');
  const r=dailyReward();S.used['D'+day()]=1;setBal(r);toast(`Промокод активирован: +${r} ⭐`);accTab();
}
function author(){const v=$('#ai').value.trim().toLowerCase();if(!v)return;
  if(Object.values(CFG.SPONSORS).includes(v)&&v===spCode)return toast('Нельзя использовать свой код');
  if(!Object.values(CFG.SPONSORS).includes(v))return toast('Код автора не найден');
  S.author=v;save();accTab()}
function wdUI(){
  const left=CFG.WD_DAILY-(S.wd.d==day()?S.wd.s:0);
  sheet(`<h2>Вывод</h2><div class="mu">Лимит на сегодня: ${fmt(left)} ⭐ (сутки с 00:00 до 00:00)</div><input id="wa" type="number" inputmode="numeric" placeholder="Сумма" style="margin:10px 0"><button class="btn" onclick="wd()">Подать заявку</button>`);
}
function wd(){
  const a=Math.floor(+$('#wa').value),left=CFG.WD_DAILY-(S.wd.d==day()?S.wd.s:0);
  if(!(a>0))return;if(a>S.bal)return toast('Недостаточно ⭐');if(a>left)return toast('Превышен дневной лимит');
  setBal(-a);S.wd={d:day(),s:(S.wd.d==day()?S.wd.s:0)+a};S.req.push({k:'wd',a,t:Date.now()});save();closeSheet();toast('Заявка на вывод создана');accTab();
}
function nftDep(){
  sheet(`<h2>Внести NFT</h2><div class="mu">1. Отправьте NFT-подарок на @${CFG.NFT_USER}<br>2. Нажмите «Я отправил». Заявку проверит администратор и начислит ⭐ по цене NFT.</div>
  <div class="row" style="margin-top:14px"><button class="btn alt" onclick="tgl('${CFG.NFT_USER}')">Открыть @${CFG.NFT_USER}</button><button class="btn" onclick="S.req.push({k:'nft',t:Date.now()});save();closeSheet();toast('Заявка отправлена')">Я отправил</button></div>`);
}
function invUI(){
  sheet(`<h2>Инвентарь NFT</h2>${S.inv.length?`<div class="list">${S.inv.map((x,k)=>`<div class="li"><div class="row" style="flex-wrap:nowrap">${art(x)}<div><b>${x.name}</b><div class="mu">${fmt(x.v)} ⭐</div></div></div><button class="btn sm gold" onclick="sellNft(${k})">Продать</button></div>`).join('')}</div>`:'<div class="mu">Пока пусто. Откройте кейс — NFT появятся здесь.</div>'}`);
}
const UN={};
function askCode(k){
  if(UN[k])return k=='sp'?sponsorUI():adminUI();
  sheet(`<h2>${k=='sp'?'Меню спонсора':'Админ панель'}</h2><div class="mu">Введите код доступа</div><input id="ci" type="password" inputmode="numeric" autocomplete="off" placeholder="Код" style="margin:10px 0"><button class="btn" onclick="chkCode('${k}')">Войти</button>`);
}
function chkCode(k){
  const v=$('#ci').value.trim();
  if(v!==(k=='sp'?CFG.CODE_SPONSOR:CFG.CODE_ADMIN)){hap('error');return toast('Неверный код')}
  UN[k]=1;k=='sp'?sponsorUI():adminUI();
}
function supportUI(){
  const go=u=>`tgl('${u}')`;
  sheet(`<h2>Поддержка</h2><div class="mu" style="margin-bottom:12px">Возникли вопросы по выводу, NFT или промокодам — напишите нам.</div><div class="list">${CFG.SUPPORT.map(u=>`<button class="btn alt" onclick="${go(u)}">💬 @${u}</button>`).join('')}</div>`);
}
function sponsorUI(){
  sheet(`<h2>Меню спонсора</h2><div class="card">Ваш код автора: <b>${spCode||'не привязан к вашему аккаунту'}</b><div class="mu" style="margin-top:6px">Вы получаете ${CFG.CREATOR_PCT}% от пополнений игроков с вашим кодом.</div></div><div class="mu" style="margin:10px 0">Статистика и список игроков приходят с сервера бота.</div>${spCode?`<button class="btn" onclick="tgl('${CFG.BOT}?start=${encodeURIComponent(spCode)}')">Моя ссылка</button>`:''}`);
}
function adminUI(){
  sheet(`<h2>Админ панель</h2><div class="list">
  <div class="card"><b>Выдать ⭐ себе</b><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="ga" type="number" placeholder="Сумма"><button class="btn sm" style="flex:none" onclick="setBal(+$('#ga').value||0);closeSheet();accTab()">Выдать</button></div></div>
  <div class="card"><b>Выдать NFT себе</b><select id="gn" style="margin-top:8px">${CASES.flatMap(c=>c.items).map(x=>`<option value="${x.id}">${x.e} ${x.name} — ${fmt(x.v)} ⭐</option>`).join('')}</select><button class="btn" style="margin-top:8px" onclick="giveNft()">Выдать</button></div>
  <div class="card"><b>Заявки (${S.req.length})</b>${S.req.map(r=>`<div class="mu">${r.k=='wd'?'Вывод '+fmt(r.a)+' ⭐':'NFT-пополнение'} · ${new Date(r.t).toLocaleString('ru-RU')}</div>`).join('')||'<div class="mu">Нет заявок</div>'}</div></div>`);
}
function giveNft(){const it=CASES.flatMap(c=>c.items).find(x=>x.id==$('#gn').value);S.inv.push({...it,t:Date.now()});save();closeSheet();toast('NFT выдан: '+it.name)}

/* ============ ОБЩЕЕ ============ */
function sheet(h){$('#sh').innerHTML=`<div class="sheet" onclick="if(event.target==this)closeSheet()"><div>${h}</div></div>`}
function closeSheet(){$('#sh').innerHTML=''}
const TABS={games:gamesTab,cases:casesTab,acc:accTab};
function tab(t){crashStop();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));closeSheet();TABS[t]();$('#main').scrollTop=0}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
setBal(0);tab('games');
/* Открыто не из Telegram/Catugram — показываем ссылку на мини-апп (для проверки в браузере добавьте ?demo=1) */
if(!inTg&&!/demo=1/.test(location.search)){
  sheet(`<div class="res"><div class="big">✈️</div><h2>Откройте в Catugram</h2><div class="mu">RubUP работает как мини-приложение бота @${CFG.BOT}.</div><button class="btn" style="margin-top:14px" onclick="location.href='${CFG.OPEN_URL}'">Открыть @${CFG.BOT}</button></div>`);
}
